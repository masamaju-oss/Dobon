<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24ドボン ―次期ボスを決める六夜の抗争―</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- 入口 -->
  <section id="screen-entry" class="screen">
    <h1 class="title">24ドボン</h1>
    <p class="subtitle">― 次期ボスを決める六夜の抗争 ―</p>
    <div class="panel">
      <label>マフィアの名前（幹部名）<input id="in-name" maxlength="16" placeholder="例: ドン・ワジュ"></label>
      <div class="row gap">
        <button id="btn-test" class="big gold">1人でテストプレイ</button>
      </div>
      <button id="btn-howto" class="big">遊び方（はじめての者はここから）</button>
      <details class="settings-box">
        <summary>部屋を作る（設定）</summary>
        <label>対戦の長さ
          <select id="in-rounds">
            <option value="6">6ラウンド（標準・六夜の抗争）</option>
            <option value="8">8ラウンド</option>
            <option value="10">10ラウンド</option>
            <option value="time">時間制</option>
            <option value="any">任意終了（ホストが決める）</option>
          </select>
        </label>
        <label>時間制の長さ
          <select id="in-minutes">
            <option value="30">30分</option>
            <option value="60" selected>60分</option>
            <option value="90">90分</option>
            <option value="120">120分</option>
            <option value="0">無制限</option>
          </select>
        </label>
        <label>脱落（破門）
          <select id="in-elimination">
            <option value="1" selected>あり（公式形・ボスの信頼）</option>
            <option value="0">なし（マイナスOK）</option>
          </select>
        </label>
        <label>手番の制限時間
          <select id="in-turnlimit">
            <option value="0" selected>オフ</option>
            <option value="15">15秒</option><option value="30">30秒</option>
            <option value="45">45秒</option><option value="60">60秒</option>
            <option value="75">75秒</option><option value="90">90秒</option>
            <option value="105">105秒</option><option value="120">120秒</option>
          </select>
        </label>
        <button id="btn-create" class="big">部屋を作る</button>
      </details>
      <div class="join-box">
        <label>部屋コードで参加<input id="in-code" maxlength="4" placeholder="ABCD" class="code-input"></label>
        <button id="btn-join" class="big">参加する</button>
      </div>
      <p id="entry-error" class="error"></p>
    </div>
    <div class="panel art-gallery">
      <h3>カード見本</h3>
      <div class="gallery">
        <img src="faces/face-24-casino.webp" alt="24・カジノ"><img src="faces/face-0.webp" alt="0・修道院">
        <img src="faces/face-7-W-up.webp" alt="7・顔役"><img src="faces/face-11-W-down.webp" alt="11・見張り"><img src="faces/face-2-W-up.webp" alt="2・荷運び">
      </div>
    </div>
  </section>

  <!-- ロビー -->
  <section id="screen-lobby" class="screen hidden">
    <h2>部屋 <span id="lobby-code" class="code-badge"></span></h2>
    <p class="hint">このコードを仲間に渡せ。全員が名前を付けたら、ホストが抗争を開始できる。</p>
    <div id="lobby-players" class="player-list"></div>
    <label>自分の名前を変更<input id="in-name2" maxlength="16"></label>
    <p id="lobby-settings" class="hint"></p>
    <button id="btn-start" class="big gold">抗争開始</button>
    <button id="btn-howto2" class="big">遊び方</button>
    <p id="lobby-wait" class="hint"></p>
  </section>

  <!-- 対戦（横画面前提: 中央に木製の卓、相手は手番順に左・正面・右） -->
  <section id="screen-game" class="screen hidden">
    <div id="error-band" class="hidden"></div>
    <header id="topbar">
      <span id="round-label"></span>
      <span id="time-label"></span>
      <span class="spacer"></span>
      <button id="btn-discard" class="mini">捨て札</button>
      <button id="btn-sound" class="mini">音: ON</button>
      <button id="btn-assist" class="mini">補助: ON</button>
      <button id="btn-oppnums" class="mini">相手の点数: 表示</button>
      <button id="btn-fullscreen" class="mini">全画面</button>
    </header>
    <div id="table-wrap">
      <div id="seat-top" class="seat seat-top"></div>
      <div id="seat-left" class="seat seat-side"></div>
      <div id="seat-right" class="seat seat-side"></div>
      <div id="table-center">
        <div id="deck-pile" class="pile" title="山札（タップで1枚引く）">
          <button id="btn-pass" class="pass-plate">パス</button>
          <div class="pile-stack"><div class="card-back"></div><div class="card-back"></div><div class="card-back"></div></div>
          <span class="pile-label">山札 <span id="deck-count"></span></span>
        </div>
        <div id="field-col">
          <div id="field-card"></div>
          <div id="field-cond" class="hidden" title="場の条件"></div>
        </div>
        <div id="discard-pile" class="pile" title="捨て札（タップで一覧）">
          <div id="discard-top"></div>
          <span class="pile-label">捨て札</span>
        </div>
        <div id="field-info"></div>
      </div>
      <div id="banner" class="hidden"></div>
      <div id="fx-banner" class="hidden"></div>
    </div>
    <div id="my-area">
      <div id="my-status"></div>
      <div id="turn-banner" class="hidden"></div>
      <div id="my-warning" class="hidden"></div>
      <div id="hand-area">
        <div class="hand-head">
          <div id="hand-totals"></div>
          <div id="my-bundles"></div>
        </div>
        <div id="hand"></div>
      </div>
    </div>
    <div id="bottom-bar">
      <div id="action-area"></div>
      <button id="btn-dobon" class="dobon-btn" disabled>ドボン</button>
    </div>
    <div id="host-tools" class="hidden">
      <button id="btn-end-reserve" class="mini">この夜で終了</button>
      <button id="btn-end-now" class="mini danger">即時終了</button>
    </div>
  </section>
</div>

<!-- 全画面ドボン返し -->
<div id="kaeshi-overlay" class="hidden">
  <div class="kaeshi-inner">
    <p class="kaeshi-title">罠だった！</p>
    <p id="kaeshi-detail"></p>
    <button id="btn-kaeshi">ドボン返し！</button>
    <p class="kaeshi-note"><span id="kaeshi-sec">3</span>秒で自動発動</p>
  </div>
</div>

<!-- 操作フィードバック用トースト（update12） -->
<div id="toast"></div>

<!-- 出たカードの大写し（全員表示・操作を妨げない） -->
<div id="played-overlay" class="hidden"></div>
<!-- 選択中カードの大写し（詳細確認＋条件選択・操作を妨げない） -->
<div id="spotlight" class="hidden"></div>

<!-- モーダル -->
<div id="modal" class="hidden"><div id="modal-box"></div></div>

<script src="client.js"></script>
</body>
</html>
